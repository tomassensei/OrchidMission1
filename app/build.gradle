plugins { id 'com.android.application' }

android {
    namespace 'pt.tvde.contas'
    compileSdk 34
    defaultConfig {
        applicationId 'pt.tvde.contas'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '2.2'
        // só os processadores dos telemóveis (deixa o APK mais pequeno)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // reconhecimento de texto no próprio telemóvel (sem internet)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // leitor de QR das faturas (ecrã da Google, sem pedir a câmara)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
