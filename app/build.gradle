plugins { id 'com.android.application' }

android {
    namespace 'pt.tvde.contas'
    compileSdk 34
    defaultConfig {
        applicationId 'pt.tvde.contas'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // reconhecimento de texto no próprio telemóvel (sem internet)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
