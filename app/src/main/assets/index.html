<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a120e">
<title>TVDE Contas</title>
<style>
/* VOICE: calmo e direto, para usar no carro entre viagens
   IDEA: o ecrã da JornadaTVDE do manual — arco das 10 h, botão amarelo, barra vermelha para deslizar
   PICTURE: o arco 0–10 h com as horas grandes ao centro
   COLOUR and TYPE: quase-preto esverdeado, verde vivo (ok/ativo), amarelo (descanso), vermelho (terminar/abaixo); fonte do sistema
   LAYOUT: coluna de telemóvel, barra Hoje · Mapa · Config fixa em baixo, folhas que sobem para cada passo */
:root{color-scheme:dark;--bg:#0a120e;--card:#111c17;--card2:#16241d;--line:#21342a;--ink:#e9f5ee;--mute:#8fa89a;--g:#34d399;--gd:#10b981;--y:#f5c518;--r:#ef4444;--o:#f59e0b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 4px}
.top h1{margin:0;font-size:20px;font-weight:800}.top h1 b{color:var(--g)}
.pill{border:1.5px solid var(--gd);color:var(--g);background:transparent;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;min-height:36px}
.hello{color:var(--mute);font-size:13px;padding:0 14px 6px}
main{max-width:560px;margin:0 auto;padding:4px 12px 16px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.card h2{font-size:13px;letter-spacing:.3px;color:var(--mute);margin:0 0 8px;font-weight:800;text-transform:uppercase}
.status{text-align:center;font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--mute)}.status.w{color:var(--g)}.status.r{color:var(--y)}
.arcw{position:relative;max-width:300px;margin:4px auto 0}.arcw svg{width:100%;display:block}
.arcc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:18px}
.clock{font-size:52px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.arcc small{color:var(--mute);font-size:13px;margin-top:6px}.arcc small b{color:var(--ink)}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;padding:0 14%;margin-top:-18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--card2);border-radius:12px;padding:8px 10px}
.tile .l{font-size:11px;color:var(--mute);font-weight:700}.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.tile .s{font-size:11px;color:var(--mute)}
.ok{color:var(--g)}.bad{color:var(--r)}.mid{color:var(--y)}
.objbar{background:var(--card2);border-radius:12px;padding:10px;margin-top:10px}
.bar{height:16px;border-radius:8px;background:#0b1712;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399)}
.bar span{position:absolute;left:8px;top:0;font-size:11px;line-height:16px;font-weight:800}
.tri{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;text-align:center}
.tri .l{font-size:10px;color:var(--mute);font-weight:800;letter-spacing:.4px}.tri .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:800;border:0;border-radius:14px;min-height:46px;padding:0 14px;cursor:pointer;color:#fff;background:var(--gd)}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:3px solid var(--g);outline-offset:1px}
.big{width:100%;min-height:62px;font-size:18px;margin-top:12px;letter-spacing:.4px}
.big.y{background:var(--y);color:#1a1400}.big.g{background:var(--gd)}
.ghost{background:var(--card2);color:var(--ink)}.outline{background:transparent;border:1.5px solid var(--line);color:var(--g);width:100%;margin-top:10px}
.link{background:none;color:var(--mute);font-weight:600;font-size:13px;min-height:36px;width:100%}
.linkr{background:none;color:var(--r);font-weight:700;width:100%}
.slidewrap{position:relative;margin-top:12px}
.slide{-webkit-appearance:none;appearance:none;width:100%;height:58px;border-radius:14px;background:#b91c1c;margin:0;padding:0 4px;border:0}
.slide.go{background:var(--gd)}
.slide::-webkit-slider-thumb{-webkit-appearance:none;width:50px;height:50px;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slide::-moz-range-thumb{width:50px;height:50px;border-radius:10px;background:#fff;border:0}
.slidewrap span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;pointer-events:none;padding-left:40px}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.rows .r:last-child{border:0}
.rows .r b{white-space:nowrap;font-variant-numeric:tabular-nums}
.tips li{margin:6px 0}
.warn{background:#3a2a07;border:1px solid #7c5a0b;color:#fde68a;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px}
.warn.r{background:#3b0d0d;border-color:#7f1d1d;color:#fecaca}
.warn button{min-height:36px;font-size:13px;margin-top:6px}
label.f{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
label.f:last-child{border:0}label.f small{display:block;color:var(--mute);font-size:12px}
label.f.wide{grid-template-columns:1fr}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0b1511;color:var(--ink);min-height:44px;width:100%}
input[inputmode]{text-align:right;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0b1511;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:6px 0}
.seg button{background:transparent;color:var(--mute);min-height:38px;border-radius:9px;font-size:13px}.seg button.on{background:var(--gd);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-height:38px;background:var(--card2);color:var(--mute);font-size:13px;padding:0 12px}.chips button.on{background:var(--gd);color:#fff}
.list .it{display:grid;grid-template-columns:minmax(0,1fr) 90px 60px 36px;gap:6px;margin:6px 0;align-items:center}
.list .it input{min-height:40px;font-size:14px}.list .x{min-height:40px;padding:0;background:#3a1717;color:#fca5a5}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:20px}
.offer{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}
.offer .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.offer .m{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:2px 0}.offer .m b{font-size:20px}
.offer .act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.offer .act button{min-height:36px;font-size:12px;padding:0 10px;background:#0b1511;color:var(--mute);border:1px solid var(--line)}
.offer .act button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal div{padding:6px 0;border-radius:8px;background:var(--card2);color:var(--mute)}.cal .w{background:#0f3d2b;color:#fff}.cal .f{background:#2a2410;color:#fde68a}.cal .h{background:none}.cal .t{outline:2px solid var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pad button{min-height:50px;font-size:22px;background:var(--card2);color:var(--ink)}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kt{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:6px 10px;text-align:left;min-height:56px;color:var(--ink)}
.kt.full{grid-column:1/-1}.kt.on{border-color:var(--g)}.kt .l{font-size:11px;color:var(--mute)}.kt .v{font-size:22px;font-weight:800}.kt .v:empty::after{content:"—";color:#40584b}
.note{color:var(--mute);font-size:13px}
pre{white-space:pre-wrap;font-size:12px;color:var(--mute);max-height:260px;overflow:auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0c1611;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:var(--mute);font-size:11px;padding:4px 0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px}
nav button.on{color:var(--g)}nav button.on svg{background:#123826;border-radius:12px}
nav svg{width:40px;height:28px;padding:3px 8px}
.alert{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:30;background:var(--r);color:#fff;border-radius:14px;padding:12px;font-weight:800;display:none;gap:10px;align-items:center;justify-content:space-between}
.alert.on{display:flex}.alert.o{background:var(--o);color:#1b1200}
@media(prefers-reduced-motion:no-preference){.sheet.on .in{animation:up .2s ease}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="alert" id="alert"><span id="alertTxt"></span><button class="ghost" id="alertOk" style="min-height:36px">OK</button></div>

<div class="top"><h1><b>TVDE</b> Contas</h1><div style="display:flex;gap:6px"><button class="pill" id="goViagens">🚗 Viagens</button></div></div>
<div class="hello" id="hello"></div>

<main>
<!-- HOJE -->
<section class="tab" id="t-hoje">
<div id="hojeWarn"></div>
<div class="card">
<div class="status" id="st"></div>
<div class="arcw"><svg viewBox="0 0 300 220" aria-hidden="true">
<path d="M 52 196 A 120 120 0 1 1 248 196" fill="none" stroke="#18271f" stroke-width="18" stroke-linecap="round"/>
<path id="arc" d="M 52 196 A 120 120 0 1 1 248 196" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
</svg><div class="arcc"><div class="clock" id="clock">0:00</div><small id="left">faltam <b>10:00</b> para as 10 h</small></div></div>
<div class="ticks"><span>0h</span><span>5h</span><span>10h</span></div>
<div class="duo"><div class="tile"><div class="l">€/H</div><div class="v" id="eh">—</div><div class="s" id="ehm"></div></div><div class="tile"><div class="l">€/KM</div><div class="v" id="ek">—</div><div class="s" id="ekm"></div></div></div>
<div class="objbar"><div class="bar"><i id="objI" style="width:0"></i><span id="objP">0%</span></div>
<div class="tri"><div><div class="l">FATURADO</div><div class="v ok" id="oFat">0,00</div></div><div><div class="l">OBJETIVO</div><div class="v" id="oObj">0,00</div></div><div><div class="l" id="oFL">FALTA</div><div class="v bad" id="oFal">0,00</div></div></div></div>
<div id="act"></div>
<button class="outline" id="mais">VER MAIS ⌄</button>
<div id="maisBox" hidden></div>
</div>
</section>

<!-- MAPA -->
<section class="tab" id="t-mapa">
<div class="seg" data-seg="mapaV"><button data-v="dia">Dia</button><button data-v="mes">Mês</button></div>
<div id="mapaBox"></div>
</section>

<!-- VIAGENS -->
<section class="tab" id="t-viagens">
<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><button class="ghost" id="vPrev" aria-label="Dia anterior">‹</button><b id="vDay"></b><button class="ghost" id="vNext" aria-label="Dia seguinte">›</button></div>
<div class="seg" data-seg="vPlat"><button data-v="">Todas</button><button data-v="Uber">Uber</button><button data-v="Bolt">Bolt</button></div>
<div class="seg" data-seg="vEst"><button data-v="">Todas</button><button data-v="ok">Aceites</button><button data-v="no">Não aceites</button></div>
<div id="vList"></div></div>
<div class="card"><h2>✈ Aeroporto de Lisboa hoje</h2><div class="rows" id="airBox"></div><p class="note">Terminal 1: 2 recolhas e 2 entregas grátis por dia, por app. O Terminal 2 nunca conta. Conta as viagens marcadas como aceites.</p></div>
<details class="card"><summary><b>Calcular uma oferta à mão</b></summary>
<div id="kRes" style="margin:8px 0"></div>
<div class="seg" data-seg="kPlat"><button data-v="Uber">Uber</button><button data-v="Bolt">Bolt</button></div>
<div class="ktiles" id="kTiles">
<button class="kt full" data-kf="v"><div class="l">Valor (€)</div><div class="v" data-ks="v"></div></button>
<button class="kt" data-kf="pm"><div class="l">Até ao cliente · min</div><div class="v" data-ks="pm"></div></button>
<button class="kt" data-kf="pk"><div class="l">Até ao cliente · km</div><div class="v" data-ks="pk"></div></button>
<button class="kt" data-kf="tm"><div class="l">Viagem · min</div><div class="v" data-ks="tm"></div></button>
<button class="kt" data-kf="tk"><div class="l">Viagem · km</div><div class="v" data-ks="tk"></div></button></div>
<div class="pad" id="pad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>,</button><button>0</button><button aria-label="Apagar">⌫</button><button class="ghost" data-p="clr" style="font-size:14px">Limpar</button><button data-p="nx" style="grid-column:span 2;font-size:16px">Seguinte ›</button></div>
</details>
</section>

<!-- CONFIG -->
<section class="tab" id="t-config"><div id="cfgBox"></div></section>
</main>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<nav>
<button data-t="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
<button data-t="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mapa</button>
<button data-t="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.1 2.7z"/></svg>Config</button>
</nav>

<script>
{
/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const dec=(v,d=2)=>(isFinite(v)?v:0).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d});
const eu=v=>dec(v)+' €';
const H=36e5,MIN=6e4,pad2=v=>String(v).padStart(2,'0');
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const hh=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const hm=ms=>{ms=Math.max(0,ms);return Math.floor(ms/H)+':'+pad2(Math.floor(ms%H/MIN))};
const hmTxt=ms=>{ms=Math.max(0,ms);return Math.floor(ms/H)+' h '+pad2(Math.floor(ms%H/MIN))};
const DOW=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const longDate=k=>{const d=new Date(k+'T12:00');return DOW[d.getDay()]+', '+d.getDate()+' de '+MES[d.getMonth()]};
const A=window.Android;

/* ================= dados ================= */
const CFG0={nome:'',viatura:'',matricula:'',apps:['Uber','Bolt'],folgasSem:[],folgasDias:[],
 empresa:'',nif:'',sede:'',licenca:'',cert:'',certVal:'',vinculo:'contrato',
 eTipo:'comb',ePaga:100,eCons:5.5,ePreco:1.65,eCasa:0.15,eFora:0.45,eOnde:'casa',luzEmpresa:false,
 fixas:[{n:'Aluguer / slot',v:''},{n:'Seguro',v:''}],repart:[{n:'Pneus',v:'',m:12}],naoFixas:[{n:'Lavagens',v:''}],
 ganhar:30,minMode:'auto',mkM:0.44,mhM:10.64,kmDia:200,hDia:9,
 cSecs:15,cFont:20,voz:true,vGood:'Viagem boa',vMid:'Analisar',vBad:'Recusar',codigo:'0000'};
let C=Object.assign({},CFG0,ls.get('jt2:cfg',{}));
let DAYS=ls.get('jt2:days',{});           // 'AAAA-MM-DD' -> dia
let CUR=ls.get('jt2:cur',null);          // dia aberto (chave) ou null
let MARKS=ls.get('jt2:marks',{});        // ofertas: at -> ok|no|cc|cm
let UNDO=ls.get('jt2:undo',[]);
const UI=Object.assign({tab:'hoje',mapaV:'dia',mapaDay:dkey(Date.now()),mapaMes:dkey(Date.now()).slice(0,7),vPlat:'',vEst:'',vDay:dkey(Date.now()),kPlat:'Uber',kf:'v',k:{v:'',pm:'',pk:'',tm:'',tk:''}},ls.get('jt2:ui',{}));
const saveC=()=>{ls.set('jt2:cfg',C);pushNative()},saveD=()=>{ls.set('jt2:days',DAYS);ls.set('jt2:cur',CUR)},saveUI=()=>ls.set('jt2:ui',UI);
function snap(){UNDO.push(JSON.stringify({DAYS,CUR}));if(UNDO.length>10)UNDO.shift();ls.set('jt2:undo',UNDO)}

/* ---- dia: períodos de trabalho e descanso a partir das marcações ---- */
function periods(d,now){
  const w=[],r=[];if(!d||!d.ev)return{w,r};let ws=null,rs=null;
  for(const e of d.ev){
    if(e.type==='start'||e.type==='back'){if(rs!=null){r.push([rs,e.t]);rs=null}ws=e.t}
    else if(e.type==='rest'){if(ws!=null){w.push([ws,e.t]);ws=null}rs=e.t}
    else if(e.type==='end'){if(ws!=null){w.push([ws,e.t]);ws=null}if(rs!=null){r.push([rs,rs]);rs=null}}
  }
  if(now&&ws!=null)w.push([ws,now]);if(now&&rs!=null)r.push([rs,now]);
  return{w,r};
}
const sum=a=>a.reduce((s,[x,y])=>s+(y-x),0);
function state(d){if(!d)return'off';const l=d.ev[d.ev.length-1];return l.type==='end'?'done':l.type==='rest'?'rest':'work'}
function kmWork(d){const ev=d.ev||[];const s=ev.find(e=>e.type==='start'),e=[...ev].reverse().find(x=>x.km);if(!s||!s.km||!e||!e.km)return 0;
  let k=num(e.km)-num(s.km);for(let i=0;i<ev.length;i++)if(ev[i].type==='rest'&&ev[i+1]&&ev[i+1].type==='back'&&ev[i].km&&ev[i+1].km)k-=Math.max(0,num(ev[i+1].km)-num(ev[i].km));return Math.max(0,k)}
function fatParts(d){const u=d.fatU||{},b=d.fatB||{};
  const uv=num(u.tl),ug=num(u.gr),ua=num(u.pr)+num(u.ou),up=num(u.po);
  const bv=num(b.ga)-num(b.po)-num(b.gj)-num(b.ca)-num(b.ou),bg=num(b.gj),ba=num(b.ca)+num(b.ou),bp=num(b.po);
  return{viagens:uv+bv,grat:ug+bg,acertos:ua+ba,port:up+bp,uber:uv+ug+ua,bolt:num(b.ga)-num(b.po)}}
function faturado(k){const d=DAYS[k];if(!d)return 0;
  if(d.fatU||d.fatB){const p=fatParts(d);return p.viagens+p.grat}
  const lido=offersOf(k).filter(o=>MARKS[o.at]==='ok').reduce((s,o)=>s+o.v,0);
  const ultimo=[...d.ev].reverse().find(e=>e.fat!=null);
  return Math.max(lido,ultimo?num(ultimo.fat):0)}

/* ---- ofertas lidas (vêm do leitor Android) ---- */
let OFFERS=[];function loadOffers(){try{OFFERS=A?JSON.parse(A.offers()||'[]'):[]}catch(e){OFFERS=[]}}
const offersOf=k=>OFFERS.filter(o=>dkey(o.at)===k);

/* ---- contas do manual (cap. 12) ---- */
function plannedDays(ym){const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate();let c=0;
  for(let i=1;i<=n;i++){const k=ym+'-'+pad2(i),dw=new Date(y,m-1,i).getDay();if(!C.folgasSem.includes(dw)&&!C.folgasDias.includes(k))c++}return c}
const isFolga=k=>C.folgasSem.includes(new Date(k+'T12:00').getDay())||C.folgasDias.includes(k);
function workedDays(ym){return Object.keys(DAYS).filter(k=>k.startsWith(ym)&&state(DAYS[k])==='done').sort()}
function hist(){const ks=Object.keys(DAYS).filter(k=>state(DAYS[k])==='done').sort().slice(-30);
  if(!ks.length)return{h:num(C.hDia)||9,km:num(C.kmDia)||200,n:0};
  let h=0,km=0,nk=0;ks.forEach(k=>{h+=sum(periods(DAYS[k]).w)/H;const x=kmWork(DAYS[k]);if(x){km+=x;nk++}});
  return{h:h/ks.length,km:nk?km/nk:(num(C.kmDia)||200),n:ks.length}}
function eKm(){const p=num(C.ePaga)/100;return C.eTipo==='elet'?num(C.eCons)/100*(C.eOnde==='fora'?num(C.eFora):C.eOnde==='misto'?(num(C.eCasa)+num(C.eFora))/2:num(C.eCasa))*p:num(C.eCons)/100*num(C.ePreco)*p}
function model(k){k=k||dkey(Date.now());const ym=k.slice(0,7),dias=plannedDays(ym)||1,hs=hist();
  const fix=C.fixas.reduce((s,x)=>s+num(x.v),0),rep=C.repart.reduce((s,x)=>s+num(x.v)/(num(x.m)||12),0),nf=C.naoFixas.reduce((s,x)=>s+num(x.v),0);
  const en=eKm()*hs.km*dias,desp=fix+rep+nf+en,ganho=desp*num(C.ganhar)/100,mes=(desp+ganho)*1.06;
  const fatAntes=workedDays(ym).filter(x=>x<k).reduce((s,x)=>s+faturado(x),0);
  const passados=workedDays(ym).filter(x=>x<k).length,falta=Math.max(1,dias-passados);
  const od=Math.max(0,mes-fatAntes)/falta,dd=(fix+rep)/dias+nf/dias+en/dias;
  const semDesp=fix+rep+nf===0,mao=C.minMode==='mao'||semDesp;   // sem despesas escritas, usa os mínimos à mão
  const mh=mao?num(C.mhM):mes/(hs.h*dias),mk=mao?num(C.mkM):mes/(hs.km*dias);
  return{dias,mes,od,dd,mh,mk,ekm:eKm(),desp,en,ganho,fatAntes,hs,semDesp}}

/* ---- 10 h em 24 h (cap. 6) ---- */
function allWork(now){const iv=[];for(const k in DAYS)periods(DAYS[k],k===CUR?now:0).w.forEach(p=>iv.push(p));return iv}
const inWin=(iv,s,e)=>iv.reduce((a,[x,y])=>a+Math.max(0,Math.min(y,e)-Math.max(x,s)),0);
function canUntil(t){const iv=allWork(t).filter(([x,y])=>y<=t);let u=t;while(u-t<10*H){const n=u+MIN;if(inWin(iv,n-24*H,n)+(n-t)>10*H+1)break;u=n}return u}
function lastEnd(){let m=0;for(const k in DAYS){const d=DAYS[k];if(k!==CUR||state(d)==='done')periods(d).w.forEach(([x,y])=>{if(y>m)m=y})}return m}

let confirmFlag=0;function confirmOnce(msg){if(Date.now()-confirmFlag<8000)return true;confirmFlag=Date.now();toast(msg);return false}
const UF=[['tl','Tarifa líquida'],['gr','Gratificação'],['pr','Promoções'],['ou','Outros rendimentos','acerto da semana anterior'],['po','Reembolsos › Portagem']];
const BF=[['ga','Ganhos','o total em baixo'],['po','Portagem'],['gj','Gorjetas'],['ca','Campanhas e bónus'],['ou','Outros rendimentos','acertos']];

/* ================= relatório do dia (cap. 5.4) ================= */
function dayStats(k){const d=DAYS[k];if(!d)return null;const{w,r}=periods(d,k===CUR?Date.now():0),work=sum(w),rest=sum(r),km=kmWork(d),fat=faturado(k),m=model(k);
  const eh=work>3e5?fat/(work/H):0,ek=km?fat/km:0,energia=km*m.ekm,lucro=fat-m.dd;return{d,w,r,work,rest,km,fat,m,eh,ek,energia,lucro}}
function tips(s){const t=[],{m}=s;
  if(s.eh)t.push(s.eh>=m.mh?[1,`Parabéns! Faturaste ${dec(s.eh)} €/hora, acima do mínimo de ${dec(m.mh)} €/hora.`]:[0,`Faturaste ${dec(s.eh)} €/hora, abaixo do mínimo de ${dec(m.mh)} €/hora.`]);
  if(s.ek)t.push(s.ek>=m.mk?[1,`Parabéns! Faturaste ${dec(s.ek)} €/km, acima do mínimo de ${dec(m.mk)} €/km.`]:[0,`Faturaste ${dec(s.ek)} €/km, abaixo do mínimo de ${dec(m.mk)} €/km. Evite ofertas com recolhas longas.`]);
  t.push(s.lucro>=0?[1,`Lucro do dia: ${eu(s.lucro)} (já descontada a despesa diária de ${eu(m.dd)}).`]:[0,`Prejuízo de ${eu(-s.lucro)}: o faturado não chegou à despesa diária de ${eu(m.dd)}.`]);
  t.push(s.fat>=m.od?[1,`Objetivo do dia cumprido: ${eu(s.fat)} de ${eu(m.od)}.`]:[0,`Faltaram ${eu(m.od-s.fat)} para o objetivo do dia de ${eu(m.od)}.`]);
  const nx=model(dkey(Date.now()+24*H));t.push([2,`Objetivo para o próximo dia de trabalho: ${eu(nx.od)}.`]);
  if(s.w.length>1){let best=null;s.w.forEach(([a,b],i)=>{const e=s.d.ev.filter(x=>x.fat!=null);const f0=i===0?0:num(e[i-1]?.fat),f1=i<e.length?num(e[i]?.fat):s.fat;const v=(f1-f0)/((b-a)/H||1);if(!best||v>best.v)best={i,a,b,v}});
    if(best&&isFinite(best.v)&&best.v>0)t.push([2,`O teu melhor turno foi o ${best.i+1}.º (${hh(best.a)}–${hh(best.b)}), com ${dec(best.v)} €/hora.`])}
  if(s.work>9*H&&C.vinculo!=='socio'&&s.rest<45*MIN)t.push([0,`Com mais de 9 h de trabalho, a pausa mínima é de 45 min (fez ${Math.round(s.rest/MIN)} min).`]);
  return t}
function openReport(k){const s=dayStats(k);if(!s)return;const{m}=s,p=fatParts(s.d);

  ${R('€/hora · mínimo '+dec(m.mh),s.eh?dec(s.eh):'—',s.eh>=m.mh?'ok':'bad')}${R('€/km · mínimo '+dec(m.mk),s.ek?dec(s.ek):'—',s.ek>=m.mk?'ok':'bad')}
  ${R('Energia (estimada)',s.km?eu(s.energia):'—')}${R('Mínimo a faturar por dia',eu(m.dd))}${R('Lucro do dia',eu(s.lucro),s.lucro>=0?'ok':'bad')}${R('Objetivo do dia',eu(m.od),s.fat>=m.od?'ok':'bad')}${R('Próximo objetivo',eu(model(dkey(Date.now()+24*H)).od))}</div>
  <div class="card"><h2>Análise e conselhos</h2><ul class="tips">${tips(s).map(([ok,x])=>`<li class="${ok===1?'ok':ok===0?'bad':''}">${esc(x)}</li>`).join('')}</ul></div>

/* ================= registo de tempos em PDF (cap. 6) ================= */

  <h1>Registo de tempos de trabalho — Motorista TVDE</h1><div>Portaria n.º 7/2022 · Período: ${pad2(first)} a ${pad2(last)}/${pad2(mo)}/${y}</div>
  <table><tr><th>Operador</th><td>${esc(C.empresa)}</td><th>NIF</th><td>${esc(C.nif)}</td></tr><tr><th>Sede</th><td colspan="3">${esc(C.sede)}</td></tr><tr><th>Licença de operador</th><td>${esc(C.licenca)}</td><th>Vínculo</th><td>${{contrato:'Contrato de trabalho',recibos:'Prestação de serviços',socio:'Sócio-gerente'}[C.vinculo]||''}</td></tr><tr><th>Motorista</th><td>${esc(C.nome)}</td><th>Certificado</th><td>${esc(C.cert)}</td></tr><tr><th>Viatura</th><td>${esc(C.viatura)}</td><th>Matrícula</th><td>${esc(C.matricula)}</td></tr></table>
  <table><tr><th>Dia</th><th>Início</th><th>Fim</th><th>Descansos</th><th>Horas de trabalho</th><th>Observações</th></tr>${rows.join('')}<tr><th colspan="4">Total da quinzena</th><th>${hm(tot)}</th><th></th></tr></table>
  <div class="s"><div>Visto do motorista</div><div>Visto do operador</div></div><p style="margin-top:20px;color:#555">Visar de 15 em 15 dias e guardar durante 5 anos.</p></body></html>`;
  if(A&&A.printHtml)A.printHtml(html,`Registo ${y}-${pad2(mo)} ${first}-${last}`);else toast('O PDF só se gera na app do telemóvel.')}

/* ================= HOJE ================= */
let alerted={};
function alertMsg(key,txt,o){if(alerted[key])return;alerted[key]=1;$('alertTxt').textContent=txt;$('alert').className='alert on'+(o?' o':'');vib();say(txt.replace(/[⛔⚠]/g,''))}
$('alertOk').onclick=()=>$('alert').className='alert';
let toastT;function toast(t){$('alertTxt').textContent=t;$('alert').className='alert on o';clearTimeout(toastT);toastT=setTimeout(()=>$('alert').className='alert',3500)}
function rHoje(){
  const now=Date.now(),k=CUR||dkey(now),d=CUR?DAYS[CUR]:(DAYS[k]&&state(DAYS[k])==='done'?DAYS[k]:null),st=state(d),m=model(k);
  $('hello').textContent=(C.nome?'Olá, '+C.nome.split(' ')[0]+' · ':'')+longDate(dkey(now));
  const{w,r}=periods(d,now),work=sum(w),rest=sum(r),seg=st==='work'?now-w[w.length-1][0]:0;
  const iv=allWork(now),win=inWin(iv,now-24*H,now),left=10*H-win;
  $('st').textContent={off:'DIA NÃO INICIADO',work:'● A TRABALHAR',rest:'● EM DESCANSO',done:'DIA TERMINADO'}[st];$('st').className='status '+(st==='work'?'w':st==='rest'?'r':'');
  $('clock').textContent=hm(work);$('left').innerHTML=left<=0?'<b class="bad">⛔ atingiu as 10 h em 24 h</b>':`faltam <b>${hm(left)}</b> para as 10 h`;
  const pct=Math.min(100,win/(10*H)*100);$('arc').setAttribute('stroke-dasharray',`${pct.toFixed(1)} 100`);$('arc').setAttribute('stroke',left<=0?'#ef4444':left<=H?'#f59e0b':'#34d399');
  const fat=d?faturado(k):0,km=d?kmWork(d):0,eh=work>3e5&&fat?fat/(work/H):0,ek=km&&fat?fat/km:0;
  $('eh').textContent=eh?dec(eh):'—';$('eh').className='v '+(eh?(eh>=m.mh?'ok':'bad'):'');$('ehm').textContent='mín. '+dec(m.mh);
  $('ek').textContent=ek?dec(ek):'—';$('ek').className='v '+(ek?(ek>=m.mk?'ok':'bad'):'');$('ekm').textContent='mín. '+dec(m.mk);
  const p=m.od?Math.min(100,fat/m.od*100):0;$('objI').style.width=p+'%';$('objP').textContent=Math.round(p)+'%';
  $('oFat').textContent=dec(fat);$('oObj').textContent=dec(m.od);const fl=m.od-fat;$('oFL').textContent=fl>0?'FALTA':'ACIMA';$('oFal').textContent=dec(Math.abs(fl));$('oFal').className='v '+(fl>0?'bad':'ok');
  const A2=$('act');if(A2.dataset.st!==st){A2.dataset.st=st;
    A2.innerHTML=st==='off'?`<button class="big g" id="bStart">▶ COMEÇAR O DIA</button>`
     :st==='work'?`<button class="big y" id="bRest">❚❚ FAZER DESCANSO</button>${slideHTML('endS','DESLIZA PARA TERMINAR O DIA')}<button class="link" id="bUndo">↶ Voltar atrás (anular o último lançamento)</button>`
     :st==='rest'?`<button class="big g" id="bBack">▶ VOLTAR AO TRABALHO</button>${slideHTML('endS','DESLIZA PARA TERMINAR O DIA')}<button class="link" id="bUndo">↶ Voltar atrás (anular o último lançamento)</button>`
     :`<button class="big g" id="bStart">▶ COMEÇAR NOVO DIA</button><button class="outline" id="bRep">Ver o relatório do dia</button><button class="link" id="bUndo">↶ Voltar atrás (reabrir o dia)</button>`;
    $('bStart')&&($('bStart').onclick=openStart);$('bRest')&&($('bRest').onclick=openRest);$('bBack')&&($('bBack').onclick=openBack);
    $('bRep')&&($('bRep').onclick=()=>openReport(lastDoneKey()));$('bUndo')&&($('bUndo').onclick=undo);onSlide('endS',openEnd)}
  /* avisos */
  const W=[];if(!C.nome||!C.matricula||!C.empresa)W.push(`<div class="warn">⚠ Falta configurar: ${[!C.nome&&'motorista',!C.matricula&&'viatura',!C.empresa&&'registo de tempos'].filter(Boolean).join(', ')}.<br><button class="ghost" data-go="config">Configurar agora</button></div>`);
  if(st==='off'&&win>6e4)W.push(`<div class="warn">10 h em 24 h: o trabalho de ontem ainda conta. Se começar agora, pode trabalhar até às <b>${hh(canUntil(now))}</b>.</div>`);
  if(st!=='off'&&C.vinculo!=='socio'&&st==='work'&&seg>=5.75*H)W.push(`<div class="warn r">⚠ Quase 6 h seguidas sem pausa: faça um descanso.</div>`);
  if(A){let on=true;try{on=A.readerOn()}catch(e){}if(!on)W.push(`<div class="warn">A leitura das ofertas Uber/Bolt está desligada.<br><button class="ghost" data-go="config">Ligar na Config</button></div>`)}
  const hw=W.join('');if($('hojeWarn').innerHTML!==hw)$('hojeWarn').innerHTML=hw;
  if(!$('maisBox').hidden)rMais(k,d,work,rest,km,fat,m);
  if(st==='work'){if(left<=0)alertMsg('h10','⛔ Atingiste as 10 horas de trabalho');else if(left<=15*MIN)alertMsg('m15','Faltam 15 minutos para as 10 horas de trabalho',1);else if(left<=H)alertMsg('h1','Falta 1 hora para as 10 horas de trabalho',1);
    if(C.vinculo!=='socio'&&seg>=5.75*H)alertMsg('p6','⚠ Quase 6 horas seguidas sem pausa. Faça um descanso.',1)}
}
function rMais(k,d,work,rest,km,fat,m){const ym=k.slice(0,7),wd=workedDays(ym),fm=wd.reduce((s,x)=>s+faturado(x),0)+(CUR&&!wd.includes(CUR)?fat:0);
  const R=(l,v,c='')=>`<div class="r"><span>${l}</span><b class="${c}">${v}</b></div>`;
  $('maisBox').innerHTML=`<div class="card rows" style="background:var(--card2)"><h2>Dinheiro do dia</h2>${R('Faturado',eu(fat),'ok')}${R('Despesa dia',eu(m.dd))}${R('Lucro',eu(fat-m.dd),fat-m.dd>=0?'ok':'bad')}</div>
  <div class="card rows" style="background:var(--card2)"><h2>O meu dia</h2>${R('Trabalho',hmTxt(work))}${R('Descanso',hmTxt(rest))}${R('Km a trabalhar',km?Math.round(km)+' km':'—')}${R('Energia estimada',km?eu(km*m.ekm):'—')}</div>

    $('mdRep')&&($('mdRep').onclick=()=>openReport(k));$('mdEdit')&&($('mdEdit').onclick=()=>openEdit(k));$('mdPdf').onclick=()=>pdfQuinzena(k);return}
  const ym=UI.mapaMes,[y,mo]=ym.split('-').map(Number),n=new Date(y,mo,0).getDate(),m=model(ym+'-01'),wd=workedDays(ym);

  ${R('Faturado',eu(fat),'ok')}${R('Objetivo do mês',eu(m.mes))}${R('% cumprida',m.mes?Math.round(fat/m.mes*100)+' %':'—',fat>=m.mes?'ok':'')}${R('Média por hora',h?dec(fat/(h/H))+' €/h':'—')}${R('Despesas do mês (previstas)',eu(m.desp))}${R('Energia (estimada)',eu(en))}</div>

   ${F('ePaga','Parte que paga eu (%)','Empresa = 0 · Eu/Slot = 100 · repartido = 25/50/75')}<p class="note">Custo por km: ${dec(m.ekm,3)} €</p></div>
  <div class="card"><h2>Despesas por mês</h2><p class="note">Fixas (mesmo valor todos os meses):</p>${list('fixas')}<p class="note">Repartidas (total ÷ meses, ex.: pneus 480 ÷ 12):</p>${list('repart','rep')}<p class="note">Não fixas (média por mês):</p>${list('naoFixas')}<p class="note">Os ordenados não são despesas.</p></div>
  <div class="card"><h2>Mínimos</h2>${seg('minMode',[['auto','Usar os calculados'],['mao','Escrever à mão']])}
   ${C.minMode==='mao'||m.semDesp?(m.semDesp&&C.minMode!=='mao'?'<p class="note">Ainda não escreveu despesas: usa estes mínimos até as escrever.</p>':'')+F('mkM','Mínimo €/km')+F('mhM','Mínimo €/h'):`<div class="rows"><div class="r"><span>€/km</span><b>${dec(m.mk)}</b></div><div class="r"><span>€/h</span><b>${dec(m.mh)}</b></div></div><p class="note">${m.hs.n?`Média dos últimos ${m.hs.n} dias: ${dec(m.hs.h,1)} h e ${Math.round(m.hs.km)} km por dia.`:'Ainda sem dias terminados: usa as médias abaixo.'}</p>${F('hDia','Média de horas por dia')}${F('kmDia','Média de km por dia')}`}</div>
  <div class="card"><h2>Cartão da oferta</h2><label class="f">Tempo no ecrã<select data-c="cSecs">${[[10,'10 s'],[15,'15 s'],[20,'20 s'],[30,'30 s'],[0,'Até eu fechar']].map(([v,t])=>`<option value="${v}" ${num(C.cSecs)===v?'selected':''}>${t}</option>`).join('')}</select></label>
   <label class="f">Tamanho das letras<small>10 a 30 · normal 20</small><input data-c="cFont" inputmode="numeric" value="${esc(C.cFont)}"></label>${seg('voz',[['true','Voz ligada'],['false','Voz desligada']])}
   ${T('vGood','Frase quando é tudo verde')}${T('vMid','Frase quando há verde e vermelho')}${T('vBad','Frase quando é tudo vermelho')}</div>
  <div class="card rows"><h2>Este mês</h2><div class="r"><span>Dias de trabalho</span><b>${m.dias}</b></div><div class="r"><span>Objetivo do mês</span><b>${eu(m.mes)}</b></div><div class="r"><span>Objetivo por dia</span><b>${eu(m.od)}</b></div><div class="r"><span>Despesa por dia</span><b>${eu(m.dd)}</b></div><div class="r"><span>Lucro previsto no mês</span><b>${eu(m.ganho)}</b></div></div>
  <div class="card"><h2>Código de acesso</h2>${F('codigo','Novo código (4 números)','','numeric')}</div>
  ${A?`<details class="card"><summary><b>Diagnóstico da leitura</b></summary><pre id="diag"></pre><div class="duo"><button class="ghost" id="dgUp">Atualizar</button><button class="ghost" id="dgCp">Copiar</button></div><button class="linkr" id="dgDel">Apagar diagnóstico</button></details>`:''}
  <button class="big g" id="cfgSave">Gravar configuração</button>`;
  const mt=$('matOk');if(mt)mt.textContent=C.matricula?(/^[A-Z0-9]{6}$/i.test(C.matricula.replace(/[^A-Z0-9]/gi,''))?'✓ Matrícula válida':'⚠ A matrícula deve ter 6 letras e números'):'';
  if(A){$('rdOpen')&&($('rdOpen').onclick=()=>A.openAccessibility());$('rdInfo')&&($('rdInfo').onclick=()=>A.openAppInfo());$('rdTest')&&($('rdTest').onclick=()=>{let ok=false;try{ok=A.testCard()}catch(e){}toast(ok?'Cartão enviado: veja no topo.':'A leitura não está ligada.')});
    const up=()=>{try{$('diag').textContent=A.diag()}catch(e){}};$('dgUp')&&($('dgUp').onclick=up);up();$('dgCp')&&($('dgCp').onclick=()=>{try{navigator.clipboard.writeText($('diag').textContent);toast('Copiado.')}catch(e){}});$('dgDel')&&($('dgDel').onclick=()=>{try{A.clearDiag()}catch(e){}up()})}
  $('cfgSave').onclick=()=>{saveC();toast('Configuração gravada.');go('hoje')}}
const cfgBox=$('cfgBox');
cfgBox.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.c){const k=t.dataset.c;C[k]=['nome','viatura','matricula','empresa','nif','sede','licenca','cert','certVal','vGood','vMid','vBad','codigo'].includes(k)?t.value:t.value;if(k==='matricula')t.value=t.value.toUpperCase();saveC();if(['cSecs','cFont'].includes(k))return;
    const mt=$('matOk');if(mt&&k==='matricula')mt.textContent=/^[A-Z0-9]{6}$/i.test(t.value.replace(/[^A-Z0-9]/gi,''))?'✓ Matrícula válida':'⚠ A matrícula deve ter 6 letras e números';return}
  if(t.dataset.l){const[k,i,f]=t.dataset.l.split('|');C[k][+i][f]=t.value;saveC();return}
  if(t.id==='fDias'){C.folgasDias=t.value.split(/[,\s]+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));saveC()}});
cfgBox.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.dataset.c){C[e.target.dataset.c]=e.target.value;saveC()}});
cfgBox.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cs){const[k,v]=b.dataset.cs.split('|');C[k]=v==='true'?true:v==='false'?false:v;saveC();rConfig()}
  else if(b.dataset.app){const a=b.dataset.app;C.apps=C.apps.includes(a)?C.apps.filter(x=>x!==a):C.apps.concat(a);saveC();rConfig()}
  else if(b.dataset.fs!=null){const i=+b.dataset.fs;C.folgasSem=C.folgasSem.includes(i)?C.folgasSem.filter(x=>x!==i):C.folgasSem.concat(i);saveC();rConfig()}
  else if(b.dataset.la){C[b.dataset.la].push(b.dataset.la==='repart'?{n:'',v:'',m:12}:{n:'',v:''});saveC();rConfig()}
  else if(b.dataset.ld){const[k,i]=b.dataset.ld.split('|');C[k].splice(+i,1);saveC();rConfig()}});

/* ================= navegação ================= */
function fillSeg(){document.querySelectorAll('[data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(UI[g.dataset.seg])===b.dataset.v)))}
document.querySelectorAll('[data-seg]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;UI[g.dataset.seg]=b.dataset.v;saveUI();fillSeg();render()}));
const R={hoje:rHoje,mapa:rMapa,viagens:rViagens,config:rConfig};
function go(t){if(!R[t])t='hoje';if(t!=='config')cfgOpen=false;UI.tab=t;saveUI();document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t||(t==='viagens'&&b.dataset.t==='hoje')));R[t]();window.scrollTo(0,0)}
function render(){R[UI.tab]&&R[UI.tab]()}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)});
window.onNativeResume=()=>{loadOffers();render()};
setInterval(()=>{if(UI.tab==='hoje')rHoje();else if(CUR&&state(DAYS[CUR])==='work'){/* avisos mesmo noutros ecrãs */const t=UI.tab;rHoje()}},1000);
loadOffers();fillSeg();pushNative();go(UI.tab==='config'?'hoje':UI.tab);if(CUR&&state(DAYS[CUR])!=='done')keep(true);
}
</script>
</body>
</html>
